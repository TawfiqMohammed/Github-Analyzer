<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Agentic GitHub Analyzer</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>🤖 Agentic GitHub Analyzer</h1>
            <p>Multi-agent AI system for repository analysis</p>
            
            <div class="input-group">
                <input 
                    type="text" 
                    id="repoUrl" 
                    placeholder="https://github.com/username/repository"
                    class="repo-input"
                >
                <button onclick="analyzeRepo()" class="btn-primary">
                    Analyze →
                </button>
            </div>

            <div class="features">
                <span>✓ Multi-Agent System</span>
                <span>✓ Real-time Analysis</span>
                <span>✓ MLOps Monitoring</span>
            </div>
        </div>

        <div class="footer">
            <p>Built by Mohammed Tawfiq with ❤️</p>
            <p>Powered by LangGraph, FastAPI, and MLOps</p>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
